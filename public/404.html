<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>404 – Page Not Found | iqplotter</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #FAF7E9;
        --ink: #1A1714;
        --subtle: #7A7265;
        --line: #E5DFD0;
        --orange: #F26B21;
        --card: #FFFFFF;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12110F;
          --ink: #FAF7E9;
          --subtle: #9E9689;
          --line: #2B2620;
          --orange: #F26B21;
          --card: #1C1916;
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background-color: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 48px 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--ink);
        text-decoration: none;
        margin-bottom: 24px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--orange);
      }
      .code {
        font-size: 54px;
        font-weight: 800;
        color: var(--orange);
        line-height: 1;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      p {
        color: var(--subtle);
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--orange);
        color: #FFFFFF;
        font-weight: 700;
        font-size: 14px;
        padding: 12px 24px;
        border-radius: 9999px;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <a href="/" class="brand">
        <span>iqplotter</span>
        <span class="dot"></span>
      </a>
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The chart, route or file you were looking for does not exist or has been moved.</p>
      <a href="/" class="btn">Back to Generator</a>
    </div>
  </body>
</html>
